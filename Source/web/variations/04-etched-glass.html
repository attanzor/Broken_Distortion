<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etched Glass — RuneFader</title>
<style>
  body {
    margin: 0; padding: 40px;
    background: #0a0a0a;
    display: flex; gap: 32px; flex-wrap: wrap;
    align-items: flex-start;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .group { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  canvas { display: block; }
  .test-section { margin-bottom: 40px; }
  .test-hint { margin-top: 6px; color: #555; font-size: 9px; }
</style>
</head>
<body>

<div class="test-section">
  <canvas id="test" width="300" height="42"></canvas>
  <div class="test-hint">
    Click/drag value &middot; Shift+click/drag slope &middot; Alt+click/drag jitter &middot; Cmd+click/drag mod &middot; Ctrl+click popup
  </div>
</div>

<div class="group">
  <canvas id="h1" width="200" height="48"></canvas>
  <canvas id="h2" width="200" height="48"></canvas>
  <canvas id="h3" width="200" height="48"></canvas>
</div>
<div class="group">
  <canvas id="v1" width="48" height="200"></canvas>
  <canvas id="v2" width="48" height="200"></canvas>
  <canvas id="v3" width="48" height="200"></canvas>
</div>

<script>
// ── Etched Glass RuneFader ──────────────────────────────────────────────────
// Same logic as reference. _paint and draw helpers replaced for etched-glass aesthetic.

const GROUND = '#11100E';
const VOID   = '#D5D0B8';
const EMBER  = '#EF8B48';
const GREEN  = '#4CAF50';
const PURPLE = '#AB47BC';

function rgba (hex, a) {
    const r = parseInt (hex.slice (1, 3), 16);
    const g = parseInt (hex.slice (3, 5), 16);
    const b = parseInt (hex.slice (5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
}

function mulSat (hex, s) {
    const r = parseInt (hex.slice (1, 3), 16), g = parseInt (hex.slice (3, 5), 16), b = parseInt (hex.slice (5, 7), 16);
    const max = Math.max (r, g, b) / 255;
    if (max === 0) return hex;
    const rr = Math.round (r * (1 - s + s / max)), gg = Math.round (g * (1 - s + s / max)), bb = Math.round (b * (1 - s + s / max));
    return '#' + [rr, gg, bb].map (v => v.toString (16).padStart (2, '0')).join ('');
}

class RuneFader {
    constructor (canvas, opts = {}) {
        this.c = canvas;
        this.ctx = canvas.getContext ('2d');
        this.h = opts.horizontal !== false;
        this.label = opts.label || '';
        this.value = opts.value !== undefined ? opts.value : 0.5;
        this.explEnabled = true;

        this._onValue      = opts.onValue      || (() => {});
        this._onModulation = opts.onModulation || (() => {});
        this._onSlope      = opts.onSlope      || (() => {});
        this._onJitter     = opts.onJitter     || (() => {});
        this._onCtrlClick  = opts.onCtrlClick  || (() => {});
        this._onInteraction= opts.onInteraction|| (() => {});

        this.modTarget  = 0;   this.modSmoothed  = 0;
        this.slpTarget  = 0;   this.slpSmoothed  = 0;
        this.jitTarget  = 0;   this.jitSmoothed  = 0;
        this.appTarget  = 0;   this.appSmoothed  = 0;

        this._drag = 'none';
        this._dragStart = 0;
        this._dragOrigin = 0;

        canvas.addEventListener ('mousedown',  this._down = this._down.bind (this));
        this._move = this._move.bind (this);
        this._up   = this._up.bind (this);
        canvas.addEventListener ('contextmenu', e => e.preventDefault());
        canvas.addEventListener ('wheel', this._wheel = this._wheel.bind (this), { passive: false });
        canvas.style.cursor = this.h ? 'ew-resize' : 'ns-resize';

        this._tick();
    }

    setTargetModulation (v)  { this.modTarget = Math.max (-1, Math.min (1, v)); }
    setAppliedModulation (v) { this.appTarget = Math.max (-1, Math.min (1, v)); }
    setSlopeModulation (v)   { this.slpTarget = Math.max (-1, Math.min (1, v)); }
    setJitterModulation (v)  { this.jitTarget = Math.max (-1, Math.min (1, v)); }
    setExplEnabled (e)       { this.explEnabled = e; }

    _rail () {
        const w = this.c.width, hh = this.c.height;
        if (this.h) {
            const y = hh / 2 + 7;
            return { left: 18, right: w - 18, y, hh: 16 };
        }
        return { top: 30, bot: hh - 16, x: w / 2, hh: 19 };
    }

    _handlePos () {
        const r = this._rail();
        if (this.h) return r.left + this.value * (r.right - r.left);
        return r.bot - this.value * (r.bot - r.top);
    }

    _valFromClient (cx, cy) {
        const rect = this.c.getBoundingClientRect();
        const mx = cx - rect.left;
        const my = cy - rect.top;
        const r = this._rail();
        const v = this.h
            ? (mx - r.left) / (r.right - r.left)
            : 1 - (my - r.top) / (r.bot - r.top);
        return Math.max (0, Math.min (1, v));
    }

    _down (e) {
        this._onInteraction();
        if (e.ctrlKey) { this._onCtrlClick(); return; }

        if (e.shiftKey)               { this._drag = 'slope';  this._dragOrigin = this.slpTarget; }
        else if (e.altKey)            { this._drag = 'jitter'; this._dragOrigin = this.jitTarget; }
        else if (e.metaKey)           { this._drag = 'mod';    this._dragOrigin = this.modTarget; }
        else {
            const v = this._valFromClient (e.clientX, e.clientY);
            this.value = v;
            this._onValue (v);
            this._drag = 'value';
        }
        this._dragStart = this.h ? e.clientX : e.clientY;
        document.addEventListener ('mousemove', this._move);
        document.addEventListener ('mouseup',   this._up);
        this._applyDrag (e);
        e.preventDefault();
    }

    _applyDrag (e) {
        const rangeRaw = this.h ? (this.c.width - 36) : (this.c.height - 46);
        const range = rangeRaw / 2;
        const delta = this.h
            ? (e.clientX - this._dragStart) / range
            : -(e.clientY - this._dragStart) / range;

        const mods = ['slope', 'jitter', 'mod'];
        const idx = mods.indexOf (this._drag);
        if (idx >= 0) {
            const setter = [(v)=>{ this.slpTarget=v; this._onSlope(v); },
                            (v)=>{ this.jitTarget=v; this._onJitter(v); },
                            (v)=>{ this.modTarget=v; this._onModulation(v); }][idx];
            const val = Math.max (-1, Math.min (1, this._dragOrigin + delta));
            setter (val);
        } else {
            this.value = this._valFromClient (e.clientX, e.clientY);
            this._onValue (this.value);
        }
    }

    _move (e) {
        if (this._drag === 'none') return;
        this._applyDrag (e);
    }

    _up () {
        this._drag = 'none';
        document.removeEventListener ('mousemove', this._move);
        document.removeEventListener ('mouseup',   this._up);
    }

    _wheel (e) {
        if (e.shiftKey) {
            e.preventDefault();
            const step = e.deltaY < 0 ? 0.001 : -0.001;
            this.value = Math.max (0, Math.min (1, this.value + step));
            this._onValue (this.value);
        }
    }

    _tick () {
        const c = 0.18;
        this.modSmoothed += (this.modTarget - this.modSmoothed) * c;
        this.slpSmoothed += (this.slpTarget - this.slpSmoothed) * c;
        this.jitSmoothed += (this.jitTarget - this.jitSmoothed) * c;
        this.appSmoothed += (this.appTarget - this.appSmoothed) * c;
        this._paint();
        requestAnimationFrame (() => this._tick());
    }

    // ── ETCHED GLASS _paint and draw helpers ─────────────────────────────

    _paint () {
        const ctx = this.ctx;
        const w = this.c.width, hh = this.c.height;
        ctx.clearRect (0, 0, w, hh);

        ctx.fillStyle = GROUND;
        ctx.fillRect (0, 0, w, hh);

        const r = this._rail();
        const hp  = this._handlePos();
        const half = r.hh;
        const spread = this.h ? 6 : r.hh * 0.45;

        // Panel — subtle rounded-rect behind the rail
        this._drawPanel (ctx, r, w, hh);

        // Label — engraved monospace, 11px
        this._drawLabel (ctx, w, hh);

        if (this.h) {
            const ry = r.y;

            // Rail — etched groove: bright line on top, dark line 1px below
            this._drawGrooveH (ctx, r.left, r.right, ry);

            // End caps — tiny screw-hole indents
            this._drawScrewHoleH (ctx, r.left, ry);
            this._drawScrewHoleH (ctx, r.right, ry);

            // Arrows — tiny, barely visible in the groove
            this._drawEtchedHArrow (ctx, r.left, r.right, ry, spread, this.modSmoothed, EMBER);
            this._drawEtchedHArrow (ctx, r.left, r.right, ry, spread, this.slpSmoothed, GREEN);
            this._drawEtchedHArrow (ctx, r.left, r.right, ry, spread, this.jitSmoothed, PURPLE);

            // Modulation line — etched style
            this._drawEtchedModLine (ctx, hp, ry, half, r.left, r.right);

            // Handle — vertical line + ember diamond
            this._drawEtchedHandleH (ctx, hp, ry, half);
        } else {
            const rx = r.x;

            // Rail — etched groove: bright line left, dark line 1px right
            this._drawGrooveV (ctx, rx, r.top, r.bot);

            // End caps
            this._drawScrewHoleV (ctx, rx, r.top);
            this._drawScrewHoleV (ctx, rx, r.bot);

            // Arrows
            this._drawEtchedVArrow (ctx, rx, r.top, r.bot, spread, this.modSmoothed, EMBER);
            this._drawEtchedVArrow (ctx, rx, r.top, r.bot, spread, this.slpSmoothed, GREEN);
            this._drawEtchedVArrow (ctx, rx, r.top, r.bot, spread, this.jitSmoothed, PURPLE);

            // Modulation line
            this._drawEtchedModLineV (ctx, rx, hp, half, r.top, r.bot);

            // Handle — horizontal line + ember diamond
            this._drawEtchedHandleV (ctx, rx, hp, half);
        }
    }

    _drawPanel (ctx, r, w, hh) {
        const pad = 6;
        const x = r.h ? r.left - pad : r.x - r.hh - pad;
        const y = r.h ? r.y - r.hh / 2 - pad : r.top - pad;
        const pw = r.h ? r.right - r.left + pad * 2 : r.hh * 2 + pad * 2;
        const ph = r.h ? r.hh + pad * 2 : r.bot - r.top + pad * 2;
        const radius = 4;
        ctx.beginPath();
        ctx.moveTo (x + radius, y);
        ctx.lineTo (x + pw - radius, y);
        ctx.quadraticCurveTo (x + pw, y, x + pw, y + radius);
        ctx.lineTo (x + pw, y + ph - radius);
        ctx.quadraticCurveTo (x + pw, y + ph, x + pw - radius, y + ph);
        ctx.lineTo (x + radius, y + ph);
        ctx.quadraticCurveTo (x, y + ph, x, y + ph - radius);
        ctx.lineTo (x, y + radius);
        ctx.quadraticCurveTo (x, y, x + radius, y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(26,26,26,0.28)';
        ctx.fill();
    }

    _drawLabel (ctx, w, hh) {
        const enabled = this.explEnabled;
        const alpha = enabled ? 0.45 : 0.18;
        ctx.textBaseline = 'top';
        ctx.textAlign = 'center';
        ctx.font = '11px "Courier New", monospace';

        // Engraved: dark shadow offset, bright text on top
        ctx.fillStyle = `rgba(0,0,0,${alpha * 1.2})`;
        ctx.fillText (this.label.toUpperCase(), w / 2 + 1, (this.h ? 1 : hh - 15) + 1);
        ctx.fillStyle = rgba (VOID, alpha);
        ctx.fillText (this.label.toUpperCase(), w / 2, this.h ? 1 : hh - 15);
    }

    // ── Horizontal rail components ────────────────────────────────────

    _drawGrooveH (ctx, left, right, y) {
        // Dark line below (shadow of the groove)
        ctx.strokeStyle = 'rgba(0,0,0,0.40)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (left, y + 1);
        ctx.lineTo (right, y + 1);
        ctx.stroke();

        // Bright line on top (highlight of the groove)
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (left, y);
        ctx.lineTo (right, y);
        ctx.stroke();
    }

    _drawScrewHoleH (ctx, x, y) {
        ctx.beginPath();
        ctx.ellipse (x, y, 1.5, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();
        // Tiny bright rim for depth
        ctx.beginPath();
        ctx.ellipse (x, y + 0.5, 1.5, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fill();
    }

    _drawEtchedHArrow (ctx, rLeft, rRight, y, spread, value, colour, strokeW = 0.5) {
        if (Math.abs (value) <= 0.001) return;
        const alpha = 0.08 + Math.abs (value) * 0.12;
        ctx.strokeStyle = rgba (colour, alpha);
        ctx.lineWidth = strokeW;
        ctx.beginPath();
        if (value > 0) {
            const tipX = rLeft + value * (rRight - rLeft);
            ctx.moveTo (rLeft, y - spread);
            ctx.lineTo (tipX, y);
            ctx.lineTo (rLeft, y + spread);
        } else {
            const tipX = rRight + value * (rRight - rLeft);
            ctx.moveTo (rRight, y - spread);
            ctx.lineTo (tipX, y);
            ctx.lineTo (rRight, y + spread);
        }
        ctx.stroke();
    }

    _drawEtchedModLine (ctx, hp, ry, half, rLeft, rRight) {
        const railW = rRight - rLeft;
        const offset = this.appSmoothed * 0.5 * railW;
        const mx = Math.max (rLeft, Math.min (rRight, hp + offset));
        const h = half * 0.65;
        // Dark line below (groove shadow)
        ctx.strokeStyle = 'rgba(0,0,0,0.32)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (mx, ry - h + 1);
        ctx.lineTo (mx, ry + h + 1);
        ctx.stroke();
        // Bright line on top (groove highlight)
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (mx, ry - h);
        ctx.lineTo (mx, ry + h);
        ctx.stroke();
    }

    _drawEtchedHandleH (ctx, hp, ry, half) {
        const enabled = this.explEnabled;
        const h = half * 0.7;
        const emberCol = enabled ? EMBER : mulSat (EMBER, 0.3);

        // Vertical line through the groove
        ctx.strokeStyle = rgba (VOID, enabled ? 0.55 : 0.18);
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (hp, ry - h);
        ctx.lineTo (hp, ry + h);
        ctx.stroke();

        // Diamond (rotated 45° square) in ember at center
        const ds = 2.0;
        ctx.save();
        ctx.translate (hp, ry);
        ctx.rotate (Math.PI / 4);
        ctx.fillStyle = emberCol;
        ctx.fillRect (-ds, -ds, ds * 2, ds * 2);
        ctx.restore();
    }

    // ── Vertical rail components ──────────────────────────────────────

    _drawGrooveV (ctx, x, top, bot) {
        // Dark line to the right (shadow of the groove)
        ctx.strokeStyle = 'rgba(0,0,0,0.40)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (x + 1, top);
        ctx.lineTo (x + 1, bot);
        ctx.stroke();

        // Bright line on the left (highlight of the groove)
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (x, top);
        ctx.lineTo (x, bot);
        ctx.stroke();
    }

    _drawScrewHoleV (ctx, x, y) {
        ctx.beginPath();
        ctx.ellipse (x, y, 1.5, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse (x + 0.5, y, 1.5, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fill();
    }

    _drawEtchedVArrow (ctx, x, rTop, rBot, spread, value, colour, strokeW = 0.5) {
        if (Math.abs (value) <= 0.001) return;
        const alpha = 0.08 + Math.abs (value) * 0.12;
        ctx.strokeStyle = rgba (colour, alpha);
        ctx.lineWidth = strokeW;
        ctx.beginPath();
        if (value < 0) {
            const tipY = rTop + Math.abs (value) * (rBot - rTop);
            ctx.moveTo (x - spread, rTop);
            ctx.lineTo (x, tipY);
            ctx.lineTo (x + spread, rTop);
        } else {
            const tipY = rBot - value * (rBot - rTop);
            ctx.moveTo (x - spread, rBot);
            ctx.lineTo (x, tipY);
            ctx.lineTo (x + spread, rBot);
        }
        ctx.stroke();
    }

    _drawEtchedModLineV (ctx, rx, hp, half, rTop, rBot) {
        const railH = rBot - rTop;
        const offset = this.appSmoothed * 0.5 * railH;
        const my = Math.max (rTop, Math.min (rBot, hp - offset));
        const h = half * 0.65;
        // Dark line to the right
        ctx.strokeStyle = 'rgba(0,0,0,0.32)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (rx - h + 1, my);
        ctx.lineTo (rx + h + 1, my);
        ctx.stroke();
        // Bright line on the left
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (rx - h, my);
        ctx.lineTo (rx + h, my);
        ctx.stroke();
    }

    _drawEtchedHandleV (ctx, rx, hp, half) {
        const enabled = this.explEnabled;
        const h = half * 0.7;
        const emberCol = enabled ? EMBER : mulSat (EMBER, 0.3);

        // Horizontal line through the groove
        ctx.strokeStyle = rgba (VOID, enabled ? 0.55 : 0.18);
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo (rx - h, hp);
        ctx.lineTo (rx + h, hp);
        ctx.stroke();

        // Diamond at center
        const ds = 2.0;
        ctx.save();
        ctx.translate (rx, hp);
        ctx.rotate (Math.PI / 4);
        ctx.fillStyle = emberCol;
        ctx.fillRect (-ds, -ds, ds * 2, ds * 2);
        ctx.restore();
    }

    destroy () {
        this.c.removeEventListener ('mousedown',  this._down);
        this.c.removeEventListener ('wheel',      this._wheel);
        this.c.removeEventListener ('contextmenu', () => {});
        document.removeEventListener ('mousemove', this._move);
        document.removeEventListener ('mouseup',   this._up);
    }
}

// ── Demo ──────────────────────────────────────────────────────────────────

const testFader = new RuneFader (document.getElementById ('test'), {
    label: 'THRESH L',
    value: 0.5,
    onValue: v => testFader.value = v,
    onCtrlClick: () => console.log ('test ctrl+click'),
});

const h1 = new RuneFader (document.getElementById ('h1'), { label: 'drive', value: 0.5, onValue: v => h1.value = v });
const h2 = new RuneFader (document.getElementById ('h2'), { label: 'mix', value: 0.3, onValue: v => h2.value = v });
const h3 = new RuneFader (document.getElementById ('h3'), { label: 'output', value: 0.7, onValue: v => h3.value = v });
const v1 = new RuneFader (document.getElementById ('v1'), { horizontal: false, label: 'res', value: 0.4, onValue: v => v1.value = v });
const v2 = new RuneFader (document.getElementById ('v2'), { horizontal: false, label: 'cut', value: 0.6, onValue: v => v2.value = v });
const v3 = new RuneFader (document.getElementById ('v3'), { horizontal: false, label: 'level', value: 0.8, onValue: v => v3.value = v });

const all = [testFader, h1, h2, h3, v1, v2, v3];

let t = 0;
function sim () {
    t += 0.02;
    for (const f of all)
        f.setAppliedModulation (Math.sin (t + all.indexOf (f) * 1.2) * 0.7);
    requestAnimationFrame (sim);
}
sim();
</script>
</body>
</html>
