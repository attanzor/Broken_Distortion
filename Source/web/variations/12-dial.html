<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>12 · Dial</title>
<style>
  body {
    margin: 0; padding: 64px;
    background: #0F0C18; color: #C4B5A5;
    font-family: 'Helvetica Neue', sans-serif; font-size: 11px;
    user-select: none;
  }
  h1 { color:#F0E6D3; font-size:14px; text-transform:uppercase; letter-spacing:1px; margin:0 0 32px; }
  canvas { display:block; margin-bottom:12px; }
  .info b { color:#E8956C; margin-right:16px; }
  .info span { color:#F0E6D3; }
  .instructions { margin-top:40px; color:rgba(196,181,165,0.4); font-size:10px; line-height:1.6; }
</style>
</head>
<body>

<h1>Dial — Arc Rail / Radial Handle / Curved Arrows</h1>

<canvas id="f" width="500" height="500"></canvas>
<div class="info">
  <b>VALUE</b> <span id="v">0.50</span>
  <b>MOD</b> <span id="m">0.00</span>
  <b>SLOPE</b> <span id="s">0.00</span>
  <b>JITTER</b> <span id="j">0.00</span>
</div>

<div class="instructions">
  Rotate = value &ensp; Shift+drag = slope (seafoam) &ensp; Alt+drag = jitter (violet) &ensp;
  Cmd+drag = modulation (coral) &ensp; Ctrl+click = popup &ensp;
  Ghost handle = mod feedback &ensp;
  Double-click + mod = reset
</div>

<script>
// ── RuneDial ──

const BG      = '#0F0C18';
const CREAM   = '#F0E6D3';
const ROSEGOLD='#E8956C';
const CORAL   = '#FF6B6B';
const SEAFOAM = '#4ECDC4';
const VIOLET  = '#C77DFF';

function rgba (hex, a) { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

class RuneDial {
    constructor (canvas, opts={}) {
        this.c=canvas; this.ctx=canvas.getContext('2d');
        this.label=opts.label||''; this.value=opts.value!==undefined?opts.value:0.5; this.explEnabled=true;
        this._onValue=opts.onValue||(()=>{}); this._onModulation=opts.onModulation||(()=>{});
        this._onSlope=opts.onSlope||(()=>{}); this._onJitter=opts.onJitter||(()=>{});
        this._onCtrlClick=opts.onCtrlClick||(()=>{}); this._onInteraction=opts.onInteraction||(()=>{});
        this.modTarget=0; this.modSmoothed=0; this.slpTarget=0; this.slpSmoothed=0;
        this.jitTarget=0; this.jitSmoothed=0; this.appTarget=0; this.appSmoothed=0;
        this._drag='none'; this._dragStart=0; this._dragOrigin=0;
        this._mods={shift:false, alt:false, meta:false};
        this._startAngle=2.356; this._sweep=4.712; // 270° from 7:30 to 4:30
        canvas.addEventListener('mousedown',this._down=this._down.bind(this));
        this._keydown=(e)=>{ if(e.shiftKey||e.altKey||e.metaKey){ this._mods.shift=e.shiftKey; this._mods.alt=e.altKey; this._mods.meta=e.metaKey; } };
        this._keyup=(e)=>{ if(['Shift','Alt','Meta'].includes(e.key)){ this._mods.shift=e.shiftKey; this._mods.alt=e.altKey; this._mods.meta=e.metaKey; } };
        document.addEventListener('keydown',this._keydown); document.addEventListener('keyup',this._keyup);
        window.addEventListener('blur',this._blur=()=>{ this._mods={shift:false, alt:false, meta:false}; });
        this._move=this._move.bind(this); this._up=this._up.bind(this);
        canvas.addEventListener('dblclick',this._dblclick=(e)=>{
            if(e.shiftKey){ this.slpTarget=0; this._onSlope(0); }
            else if(e.altKey){ this.jitTarget=0; this._onJitter(0); }
            else if(e.metaKey){ this.modTarget=0; this._onModulation(0); }
        });
        canvas.addEventListener('contextmenu',e=>e.preventDefault());
        canvas.addEventListener('wheel',this._wheel=this._wheel.bind(this),{passive:false});
        canvas.style.cursor='grab';
        this._tick();
    }
    setTargetModulation(v){ this.modTarget=Math.max(-1,Math.min(1,v)); }
    setAppliedModulation(v){ this.appTarget=Math.max(-1,Math.min(1,v)); }
    setSlopeModulation(v){ this.slpTarget=Math.max(-1,Math.min(1,v)); }
    setJitterModulation(v){ this.jitTarget=Math.max(-1,Math.min(1,v)); }
    setExplEnabled(e){ this.explEnabled=e; }

    // ── Geometry ──
    _center(){ const w=this.c.width, hh=this.c.height; return {cx:w/2, cy:hh/2, r:Math.min(w,hh)/2-24, pad:4}; }
    _angleForValue(v){ return this._startAngle+v*this._sweep; }
    _valueForAngle(a){
        let raw=(a-this._startAngle)/this._sweep;
        if(raw<0) raw+=1; if(raw>1) raw-=1;
        return Math.max(0,Math.min(1,raw));
    }
    _valFromClient(clientX,clientY){
        const c=this._center(), rect=this.c.getBoundingClientRect();
        const mx=clientX-rect.left-c.cx, my=clientY-rect.top-c.cy;
        return this._valueForAngle(Math.atan2(my,mx));
    }

    // ── Events ──
    _down(e){
        this._onInteraction();
        if(e.ctrlKey){ this._onCtrlClick(); return; }
        if(e.shiftKey){ this._drag='slope'; this._dragOrigin=this.slpTarget; }
        else if(e.altKey){ this._drag='jitter'; this._dragOrigin=this.jitTarget; }
        else if(e.metaKey){ this._drag='mod'; this._dragOrigin=this.modTarget; }
        else{
            const v=this._valFromClient(e.clientX,e.clientY);
            this.value=v; this._onValue(v); this._drag='value';
        }
        this._dragStart=e.clientX;
        document.addEventListener('mousemove',this._move);
        document.addEventListener('mouseup',this._up);
        this._applyDrag(e); e.preventDefault();
    }
    _applyDrag(e){
        if(this._drag==='value'){
            this.value=this._valFromClient(e.clientX,e.clientY); this._onValue(this.value);
        }else{
            const c=this._center();
            const range=c.r*1.5;
            const delta=(e.clientX-this._dragStart)/range;
            const mods=['slope','jitter','mod'], idx=mods.indexOf(this._drag);
            const setter=[(v)=>{this.slpTarget=v;this._onSlope(v)},(v)=>{this.jitTarget=v;this._onJitter(v)},(v)=>{this.modTarget=v;this._onModulation(v)}][idx];
            setter(Math.max(-1,Math.min(1,this._dragOrigin+delta)));
        }
    }
    _move(e){ if(this._drag!=='none') this._applyDrag(e); }
    _up(){
        const snap=0.015;
        if(this._drag==='slope' && Math.abs(this.slpTarget)<snap){ this.slpTarget=0; this._onSlope(0); }
        if(this._drag==='jitter' && Math.abs(this.jitTarget)<snap){ this.jitTarget=0; this._onJitter(0); }
        if(this._drag==='mod' && Math.abs(this.modTarget)<snap){ this.modTarget=0; this._onModulation(0); }
        this._drag='none'; document.removeEventListener('mousemove',this._move); document.removeEventListener('mouseup',this._up);
    }
    _wheel(e){ if(e.shiftKey){ e.preventDefault(); this.value=Math.max(0,Math.min(1,this.value+(e.deltaY<0?0.001:-0.001))); this._onValue(this.value); } }
    _tick(){
        const c=0.18;
        this.modSmoothed+=(this.modTarget-this.modSmoothed)*c;
        this.slpSmoothed+=(this.slpTarget-this.slpSmoothed)*c;
        this.jitSmoothed+=(this.jitTarget-this.jitSmoothed)*c;
        this.appSmoothed+=(this.appTarget-this.appSmoothed)*c;
        this._paint(); requestAnimationFrame(()=>this._tick());
    }

    // ── PAINT ──
    _paint(){
        const ctx=this.ctx, w=this.c.width, hh=this.c.height;
        ctx.fillStyle=BG; ctx.fillRect(0,0,w,hh);
        const c=this._center(), a=this._angleForValue(this.value);
        const labelH=14;

        // Label
        ctx.fillStyle=rgba('#C4B5A5', 0.7);
        ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText(this.label.toUpperCase(), w/2, 4);

        // Enclosing rect
        const pad=4;
        const rect={x:pad, y:labelH+4, w:w-pad*2, h:hh-labelH-8};
        ctx.strokeStyle=rgba(CREAM,0.12); ctx.lineWidth=0.5;
        ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);

        const cx=c.cx, cy=c.cy, r=c.r, sa=this._startAngle, ea=sa+this._sweep;

        // Rail — tapered arc
        this._drawArcRail(ctx,cx,cy,r,sa,ea);

        // Curved arrows on outer circumference
        this._drawCurvedArrows(ctx,cx,cy,r,sa,ea);

        // Zero-edge lines at arc endpoints
        this._drawZeroLines(ctx,cx,cy,r,sa,ea);

        // Ghost handle (modulation feedback) + gradient arc
        this._drawGhost(ctx,cx,cy,r,sa,ea,a);

        // Handle — radial line from center to arc
        const hx=cx+r*Math.cos(a), hy=cy+r*Math.sin(a);
        ctx.strokeStyle=CREAM; ctx.lineWidth=4.8;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(hx,hy); ctx.stroke();
        ctx.fillStyle=CREAM;
        ctx.beginPath(); ctx.ellipse(cx,cy,4.2,4.2,0,0,Math.PI*2); ctx.fill();
    }

    // ── Tapered arc rail ──
    _drawArcRail(ctx,cx,cy,r,sa,ea){
        const alpha=this.explEnabled?0.9:0.3;
        const grad=ctx.createRadialGradient(cx,cy,r*0.3, cx,cy,r);
        grad.addColorStop(0, rgba('#F0E6D3',0));
        grad.addColorStop(0.7, rgba('#F0E6D3',alpha*0.3));
        grad.addColorStop(0.85, rgba('#F0E6D3',alpha*0.6));
        grad.addColorStop(1, rgba('#F0E6D3',alpha*0.8));
        ctx.strokeStyle=grad; ctx.lineWidth=2.4;
        ctx.beginPath(); ctx.arc(cx,cy,r,sa,ea); ctx.stroke();
        // inner ring
        ctx.strokeStyle=rgba('#F0E6D3',alpha*0.15);
        ctx.lineWidth=0.8;
        ctx.beginPath(); ctx.arc(cx,cy,r*0.7,sa,ea); ctx.stroke();
    }

    // ── Curved arrows on outer circumference ──
    _drawCurvedArrows(ctx,cx,cy,r,sa,ea){
        const arrows=[
            {v:this.modSmoothed, col:CORAL, mod:'meta'},
            {v:this.slpSmoothed, col:SEAFOAM, mod:'shift'},
            {v:this.jitSmoothed, col:VIOLET, mod:'alt'},
        ].filter(a=>Math.abs(a.v)>0.001);
        arrows.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
        const angSpread=0.08, ir=r*0.75;
        for(const a of arrows){
            const lw=this._mods[a.mod]?3.6:1.8;
            ctx.strokeStyle=rgba(a.col,1); ctx.lineWidth=lw;
            const baseAngle=a.v>0?sa:ea;
            const tipAngle=a.v>0?sa+a.v*this._sweep:ea+a.v*this._sweep;
            // Base endpoints on outer circle
            const bx1=cx+r*Math.cos(baseAngle-angSpread), by1=cy+r*Math.sin(baseAngle-angSpread);
            const bx2=cx+r*Math.cos(baseAngle+angSpread), by2=cy+r*Math.sin(baseAngle+angSpread);
            // Tip on inner circle at arrow angle
            const tx=cx+ir*Math.cos(tipAngle), ty=cy+ir*Math.sin(tipAngle);
            // Three lines: base, top diagonal, bottom diagonal
            ctx.beginPath(); ctx.moveTo(bx1,by1); ctx.lineTo(bx2,by2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx1,by1); ctx.lineTo(tx,ty); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(bx2,by2); ctx.stroke();
        }
    }

    // ── Zero-edge lines at arc endpoints ──
    _drawZeroLines(ctx,cx,cy,r,sa,ea){
        const checks=[
            {mod:'shift', v:this.slpSmoothed, col:SEAFOAM},
            {mod:'alt',   v:this.jitSmoothed, col:VIOLET},
            {mod:'meta',  v:this.modSmoothed, col:CORAL},
        ];
        const hs=r*0.04, hl=r*0.12;
        for(const ck of checks){
            if(this._mods[ck.mod] && Math.abs(ck.v)<0.001){
                ctx.strokeStyle=rgba(ck.col,1); ctx.lineWidth=3.6;
                for(const angle of [sa,ea]){
                    const px=cx+(r+hl)*Math.cos(angle), py=cy+(r+hl)*Math.sin(angle);
                    const dx=cx+(r-hl)*Math.cos(angle), dy=cy+(r-hl)*Math.sin(angle);
                    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(dx,dy); ctx.stroke();
                }
            }
        }
    }

    // ── Ghost handle + gradient arc ──
    _drawGhost(ctx,cx,cy,r,sa,ea,ha){
        const offset=this.appSmoothed*0.5*this._sweep;
        if(Math.abs(offset)<0.01)return;
        const ghostAngle=ha+offset;
        const clamped=Math.max(sa,Math.min(ea,ghostAngle));
        // Gradient arc between handle and ghost
        const from=Math.min(ha,clamped), to=Math.max(ha,clamped);
        if(to-from>0.01){
            const g=ctx.createRadialGradient(cx,cy,r*0.5, cx,cy,r);
            if(clamped<ha){ g.addColorStop(0,rgba(CREAM,0)); g.addColorStop(1,rgba(CREAM,0.18)); }
            else{ g.addColorStop(0,rgba(CREAM,0.18)); g.addColorStop(1,rgba(CREAM,0)); }
            ctx.strokeStyle=g; ctx.lineWidth=r*0.05;
            ctx.beginPath(); ctx.arc(cx,cy,r*0.85,from,to); ctx.stroke();
        }
        // Ghost radial line
        const ir=r*0.85;
        const gx=cx+ir*Math.cos(clamped), gy=cy+ir*Math.sin(clamped);
        ctx.strokeStyle=rgba(CREAM,0.5); ctx.lineWidth=4.8;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(gx,gy); ctx.stroke();
        ctx.fillStyle=rgba(CREAM,0.5);
        ctx.beginPath(); ctx.ellipse(cx,cy,4.2,4.2,0,0,Math.PI*2); ctx.fill();
    }

    destroy(){
        this.c.removeEventListener('mousedown',this._down);
        this.c.removeEventListener('dblclick',this._dblclick);
        this.c.removeEventListener('wheel',this._wheel);
        this.c.removeEventListener('contextmenu',()=>{});
        window.removeEventListener('blur',this._blur);
        document.removeEventListener('keydown',this._keydown);
        document.removeEventListener('keyup',this._keyup);
        document.removeEventListener('mousemove',this._move);
        document.removeEventListener('mouseup',this._up);
    }
}

// ── Test ──
const f=new RuneDial(document.getElementById('f'),{
    label:'DRIVE', value:0.5,
    onValue(v){ document.getElementById('v').textContent=v.toFixed(3); },
    onModulation(v){ document.getElementById('m').textContent=v.toFixed(3); },
    onSlope(v){ document.getElementById('s').textContent=v.toFixed(3); },
    onJitter(v){ document.getElementById('j').textContent=v.toFixed(3); },
    onCtrlClick(){ console.log('Popup'); },
});

let t=0;
setInterval(()=>{ t+=0.04; f.setAppliedModulation(Math.sin(t*1.3)*0.5); },50);
</script>
</body>
</html>
