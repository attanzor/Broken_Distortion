<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>10 · Straight Line Handle</title>
<style>
  body {
    margin: 0; padding: 64px;
    background: #0F0C18; color: #C4B5A5;
    font-family: 'Helvetica Neue', sans-serif; font-size: 11px;
    user-select: none;
  }
  h1 { color:#F0E6D3; font-size:14px; text-transform:uppercase; letter-spacing:1px; margin:0 0 32px; }
  canvas { display:block; margin-bottom:12px; }
  .info b { color:#E8956C; margin-right:16px; }
  .info span { color:#F0E6D3; }
  .instructions { margin-top:40px; color:rgba(196,181,165,0.4); font-size:10px; line-height:1.6; }
</style>
</head>
<body>

<h1>Straight Line Handle — Enclosed Rect / Outline Arrows / Mod Line</h1>

<canvas id="f" width="500" height="72"></canvas>
<div class="info">
  <b>VALUE</b> <span id="v">0.50</span>
  <b>MOD</b> <span id="m">0.00</span>
  <b>SLOPE</b> <span id="s">0.00</span>
  <b>JITTER</b> <span id="j">0.00</span>
</div>

<div class="instructions">
  Drag = value &ensp; Shift+drag = slope (seafoam) &ensp; Alt+drag = jitter (violet) &ensp;
  Cmd+drag = modulation (coral) &ensp; Ctrl+click = popup &ensp;
  White diamond = mod feedback (moves with handle)
</div>

<script>
// ── Prismatic RuneFader ──

const BG      = '#0F0C18';
const CREAM   = '#F0E6D3';
const ROSEGOLD='#E8956C';
const CORAL   = '#FF6B6B';
const SEAFOAM = '#4ECDC4';
const VIOLET  = '#C77DFF';

function rgba (hex, a) {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
}

class RuneFader {
    constructor (canvas, opts={}) {
        this.c=canvas; this.ctx=canvas.getContext('2d'); this.h=opts.horizontal!==false;
        this.label=opts.label||''; this.value=opts.value!==undefined?opts.value:0.5; this.explEnabled=true;
        this._onValue=opts.onValue||(()=>{}); this._onModulation=opts.onModulation||(()=>{});
        this._onSlope=opts.onSlope||(()=>{}); this._onJitter=opts.onJitter||(()=>{});
        this._onCtrlClick=opts.onCtrlClick||(()=>{}); this._onInteraction=opts.onInteraction||(()=>{});
        this.modTarget=0; this.modSmoothed=0; this.slpTarget=0; this.slpSmoothed=0;
        this.jitTarget=0; this.jitSmoothed=0; this.appTarget=0; this.appSmoothed=0;
        this._drag='none'; this._dragStart=0; this._dragOrigin=0;
        canvas.addEventListener('mousedown',this._down=this._down.bind(this));
        this._move=this._move.bind(this); this._up=this._up.bind(this);
        canvas.addEventListener('contextmenu',e=>e.preventDefault());
        canvas.addEventListener('wheel',this._wheel=this._wheel.bind(this),{passive:false});
        canvas.style.cursor=this.h?'ew-resize':'ns-resize';
        this._tick();
    }
    setTargetModulation(v){ this.modTarget=Math.max(-1,Math.min(1,v)); }
    setAppliedModulation(v){ this.appTarget=Math.max(-1,Math.min(1,v)); }
    setSlopeModulation(v){ this.slpTarget=Math.max(-1,Math.min(1,v)); }
    setJitterModulation(v){ this.jitTarget=Math.max(-1,Math.min(1,v)); }
    setExplEnabled(e){ this.explEnabled=e; }
    _rail(){
        const w=this.c.width, hh=this.c.height;
        if(this.h){ const h=hh/2+7; return {left:18,right:w-18,y:h,hh:16}; }
        return {top:30,bot:hh-16,x:w/2,hh:19};
    }
    _handlePos(){
        const r=this._rail();
        return this.h? r.left+this.value*(r.right-r.left): r.bot-this.value*(r.bot-r.top);
    }
    _valFromClient(cx,cy){
        const rect=this.c.getBoundingClientRect(), mx=cx-rect.left, my=cy-rect.top, r=this._rail();
        const v=this.h?(mx-r.left)/(r.right-r.left):1-(my-r.top)/(r.bot-r.top);
        return Math.max(0,Math.min(1,v));
    }
    _down(e){
        this._onInteraction();
        if(e.ctrlKey){ this._onCtrlClick(); return; }
        if(e.shiftKey){ this._drag='slope'; this._dragOrigin=this.slpTarget; }
        else if(e.altKey){ this._drag='jitter'; this._dragOrigin=this.jitTarget; }
        else if(e.metaKey){ this._drag='mod'; this._dragOrigin=this.modTarget; }
        else{ const v=this._valFromClient(e.clientX,e.clientY); this.value=v; this._onValue(v); this._drag='value'; }
        this._dragStart=this.h?e.clientX:e.clientY;
        document.addEventListener('mousemove',this._move);
        document.addEventListener('mouseup',this._up);
        this._applyDrag(e); e.preventDefault();
    }
    _applyDrag(e){
        const rr=this.h?this.c.width-36:this.c.height-46, range=rr/2;
        const delta=this.h?(e.clientX-this._dragStart)/range:-(e.clientY-this._dragStart)/range;
        const mods=['slope','jitter','mod'], idx=mods.indexOf(this._drag);
        if(idx>=0){
            const setter=[(v)=>{this.slpTarget=v;this._onSlope(v)},(v)=>{this.jitTarget=v;this._onJitter(v)},(v)=>{this.modTarget=v;this._onModulation(v)}][idx];
            setter(Math.max(-1,Math.min(1,this._dragOrigin+delta)));
        }else{ this.value=this._valFromClient(e.clientX,e.clientY); this._onValue(this.value); }
    }
    _move(e){ if(this._drag!=='none') this._applyDrag(e); }
    _up(){ this._drag='none'; document.removeEventListener('mousemove',this._move); document.removeEventListener('mouseup',this._up); }
    _wheel(e){ if(e.shiftKey){ e.preventDefault(); this.value=Math.max(0,Math.min(1,this.value+(e.deltaY<0?0.001:-0.001))); this._onValue(this.value); } }
    _tick(){
        const c=0.18;
        this.modSmoothed+=(this.modTarget-this.modSmoothed)*c;
        this.slpSmoothed+=(this.slpTarget-this.slpSmoothed)*c;
        this.jitSmoothed+=(this.jitTarget-this.jitSmoothed)*c;
        this.appSmoothed+=(this.appTarget-this.appSmoothed)*c;
        this._paint(); requestAnimationFrame(()=>this._tick());
    }

    // ── PAINT ──
    _paint(){
        const ctx=this.ctx, w=this.c.width, hh=this.c.height;
        ctx.fillStyle=BG; ctx.fillRect(0,0,w,hh);

        const r=this._rail(), hp=this._handlePos(), lw=this.h?2.4:1.6, rhh=r.hh;
        const spread=this.h?10.667:rhh*2/3;

        // Label — warm grey, small
        ctx.fillStyle=rgba('#C4B5A5', 0.7);
        ctx.font=(this.h?'12px':'10px')+' sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText(this.label.toUpperCase(), w/2, this.h?0:hh-14);

        if(this.h){
            // ── HORIZONTAL ──
            const pad=4;
            const rect={x:r.left-pad, y:r.y-spread-pad, w:r.right-r.left+pad*2, h:spread*2+pad*2};
            // Enclosing rectangle
            ctx.strokeStyle=rgba(CREAM,0.12); ctx.lineWidth=0.5;
            ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);
            // Rail
            this._drawTaperedRail(ctx,r,this.h);
            // Arrows — outlined, base at rect corners
            this._drawOutlineArrowsH(ctx,rect,r.y,spread);
            // Modulation feedback — white line behind handle
            this._drawModLine(ctx,hp,r.y,rhh,r.left,r.right,lw);
            // Handle — perpendicular line, wider than original
            const hndC=this.explEnabled?ROSEGOLD:'#555';
            const hh2=rhh*1.6;
            ctx.strokeStyle=hndC; ctx.lineWidth=lw;
            ctx.beginPath(); ctx.moveTo(hp, r.y-hh2); ctx.lineTo(hp, r.y+hh2); ctx.stroke();
            ctx.fillStyle=hndC;
            ctx.beginPath(); ctx.ellipse(hp,r.y,2.8,2.8,0,0,Math.PI*2); ctx.fill();
        }else{
            // ── VERTICAL ──
            const pad=4;
            const rect={x:r.x-spread-pad, y:r.top-pad, w:spread*2+pad*2, h:r.bot-r.top+pad*2};
            ctx.strokeStyle=rgba(CREAM,0.12); ctx.lineWidth=0.5;
            ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);
            this._drawTaperedRailV(ctx,r);
            this._drawOutlineArrowsV(ctx,rect,r.x,spread);
            // Modulation feedback — white line behind handle
            this._drawModLineV(ctx,r.x,hp,rhh,r.top,r.bot,lw);
            // Handle — perpendicular line, wider than original
            const hndCv=this.explEnabled?ROSEGOLD:'#555';
            const w2=rhh*1.6;
            ctx.strokeStyle=hndCv; ctx.lineWidth=lw;
            ctx.beginPath(); ctx.moveTo(r.x-w2, hp); ctx.lineTo(r.x+w2, hp); ctx.stroke();
            ctx.fillStyle=hndCv;
            ctx.beginPath(); ctx.ellipse(r.x,hp,2.8,2.8,0,0,Math.PI*2); ctx.fill();
        }
    }

    // ── Tapered rail: fades at edges via gradient ──
    _drawTaperedRail(ctx,r,ish){
        const alpha=this.explEnabled?0.9:0.3;
        const engine=(ish?1:0.7);
        const grad=ctx.createLinearGradient(r.left,0,r.right,0);
        grad.addColorStop(0, rgba('#F0E6D3',0));
        grad.addColorStop(0.12, rgba('#F0E6D3',alpha*engine*0.4));
        grad.addColorStop(0.5, rgba('#F0E6D3',alpha*engine));
        grad.addColorStop(0.88, rgba('#F0E6D3',alpha*engine*0.4));
        grad.addColorStop(1, rgba('#F0E6D3',0));
        ctx.strokeStyle=grad; ctx.lineWidth=ish?2.4:1.6;
        ctx.beginPath(); ctx.moveTo(r.left,r.y); ctx.lineTo(r.right,r.y); ctx.stroke();
    }
    _drawTaperedRailV(ctx,r){
        const alpha=this.explEnabled?0.9:0.3;
        const grad=ctx.createLinearGradient(0,r.top,0,r.bot);
        grad.addColorStop(0, rgba('#F0E6D3',0));
        grad.addColorStop(0.15, rgba('#F0E6D3',alpha*0.4));
        grad.addColorStop(0.5, rgba('#F0E6D3',alpha*0.7));
        grad.addColorStop(0.85, rgba('#F0E6D3',alpha*0.4));
        grad.addColorStop(1, rgba('#F0E6D3',0));
        ctx.strokeStyle=grad; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(r.x,r.top); ctx.lineTo(r.x,r.bot); ctx.stroke();
    }

    // ── Modulation feedback: white perpendicular line behind handle ──
    _drawModLine(ctx,hp,ry,rhh,rLeft,rRight,lw){
        const railW=rRight-rLeft;
        const offset=this.appSmoothed*0.5*railW;
        const mx=Math.max(rLeft,Math.min(rRight,hp+offset));
        const h=rhh*0.7;
        ctx.strokeStyle=rgba(CREAM,0.2);
        ctx.lineWidth=lw;
        ctx.beginPath(); ctx.moveTo(mx,ry-h); ctx.lineTo(mx,ry+h); ctx.stroke();
    }
    _drawModLineV(ctx,rx,hp,rhh,rTop,rBot,lw){
        const railH=rBot-rTop;
        const offset=this.appSmoothed*0.5*railH;
        const my=Math.max(rTop,Math.min(rBot,hp-offset));
        const h=rhh*0.7;
        ctx.strokeStyle=rgba(CREAM,0.2);
        ctx.lineWidth=lw;
        ctx.beginPath(); ctx.moveTo(rx-h,my); ctx.lineTo(rx+h,my); ctx.stroke();
    }

    destroy(){
        this.c.removeEventListener('mousedown',this._down);
        this.c.removeEventListener('wheel',this._wheel);
        this.c.removeEventListener('contextmenu',()=>{});
        document.removeEventListener('mousemove',this._move);
        document.removeEventListener('mouseup',this._up);
    }
}

// ── Test ──
const f=new RuneFader(document.getElementById('f'),{
    label:'THRESH L', horizontal:true, value:0.5,
    onValue(v){ document.getElementById('v').textContent=v.toFixed(3); },
    onModulation(v){ document.getElementById('m').textContent=v.toFixed(3); },
    onSlope(v){ document.getElementById('s').textContent=v.toFixed(3); },
    onJitter(v){ document.getElementById('j').textContent=v.toFixed(3); },
    onCtrlClick(){ console.log('Popup'); },
});

let t=0;
setInterval(()=>{ t+=0.04; f.setAppliedModulation(Math.sin(t*1.3)*0.5); },50);
</script>
</body>
</html>
