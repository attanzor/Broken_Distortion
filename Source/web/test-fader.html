<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RuneFader Test</title>
<style>
  body { margin:0; padding:48px; background:#11100E; color:#D5D0B8;
         font-family:sans-serif; font-size:11px; }
  h1 { color:#EF8B48; font-size:15px; text-transform:uppercase; margin:0 0 32px; }
  canvas { display:block; margin-bottom:16px; }
  .row { display:flex; gap:8px; align-items:flex-start; }
  .info { color:#D5D0B8; font-size:11px; }
  .info b { color:#EF8B48; }
  .instructions { margin-top:48px; color:rgba(213,208,184,0.5); font-size:10px; line-height:1.6; }
</style>
</head>
<body>
<h1>RuneFader — Single Fader Test</h1>

<canvas id="f" width="300" height="42"></canvas>
<div class="info">
  Value: <b id="v">0.50</b> &nbsp;
  Mod: <b id="m">0.00</b> &nbsp;
  Slope: <b id="s">0.00</b> &nbsp;
  Jitter: <b id="j">0.00</b>
</div>

<div class="instructions">
  Click/drag on fader → moves value<br>
  Shift+drag → slope modulation (green arrow at rail edge)<br>
  Alt+drag → jitter modulation (purple arrow at rail edge)<br>
  Ctrl+click → opens popup (see console)
</div>

<script src="rune-fader.js"></script>
<script>
const f = new RuneFader (document.getElementById ('f'), {
    label: 'THRESH L', horizontal: true, value: 0.5,
    onValue (v)      { document.getElementById ('v').textContent = v.toFixed(3); },
    onModulation (v) { document.getElementById ('m').textContent = v.toFixed(3); },
    onSlope (v)      { document.getElementById ('s').textContent = v.toFixed(3); },
    onJitter (v)     { document.getElementById ('j').textContent = v.toFixed(3); },
    onCtrlClick ()   { console.log('Popup: THRESH LOW'); },
});

// Simulated applied modulation (white line moves offset from handle)
let t = 0;
setInterval (() => {
    t += 0.04;
    f.setAppliedModulation (Math.sin (t * 1.3) * 0.5);
}, 50);
</script>
</body>
</html>
